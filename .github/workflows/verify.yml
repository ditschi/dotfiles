---
name: verify

on:
  push:
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ansible: ${{ steps.filter.outputs.ansible }}
      hosts: ${{ steps.filter.outputs.hosts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ansible:
              - 'ansible/**'
              - '.ansible-lint'
              - 'tests/requirements.txt'
              - '.github/workflows/verify.yml'
            hosts:
              - 'machine/hosts/**'
              - 'tests/hosts/**'
              - 'machine_cli/**'
              - 'tests/integration/test_host_yaml_install.py'
              - 'tests/unit/test_host_profiles.py'

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: |
          pip install -r tests/requirements.txt
      - name: Reject committed host-only Git settings
        run: python3 -m machine_cli.local_overrides --check
      - name: Unit tests and CLI smoke
        run: |
          python3 -m py_compile machine_cli/machine
          python3 -m compileall -q machine_cli
          pytest tests/unit -q
      - name: Ansible syntax
        run: |
          ansible-galaxy collection install -r ansible/requirements.yml
          ansible-playbook --syntax-check -i ansible/inventory/local.yml ansible/workstation.yml

  ansible-lint:
    needs: changes
    if: needs.changes.outputs.ansible == 'true' || needs.changes.outputs.hosts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ansible-lint
        run: |
          pip install -r tests/requirements.txt
          ansible-galaxy collection install -r ansible/requirements.yml
      - name: Lint ansible + host configs
        run: |
          ansible-lint ansible/workstation.yml ansible/homelab.yml ansible/site.yml ansible/dump_packages.yml ansible/dump_monitoring.yml
          python3 - <<'PY'
          from pathlib import Path
          from importlib.machinery import SourceFileLoader
          cli = SourceFileLoader("m", "machine_cli/machine").load_module()
          for path in sorted([*Path("machine/hosts").glob("*.yml"), *Path("tests/hosts").glob("*.yml")]):
              assert "profile:" not in path.read_text(), path
              data = cli.parse_profile_file(path)
              assert data["device"] in cli.DEVICES, path
              assert data["context"] in [*cli.CONTEXTS, ""], path
              for feat in data.get("features") or []:
                  assert feat in cli.FEATURES, (path, feat)
          print("host configs ok")
          PY

  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run all hooks
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure --verbose

  presets:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [private-desktop, work-desktop, private-server, container]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install -r tests/requirements.txt
      - name: Docker host smoke
        run: |
          pytest -q -m "docker and not apt" \
            "tests/integration/test_profile_containers.py::test_host_dotfiles[${{ matrix.host }}]" \
            "tests/integration/test_profile_containers.py::test_shells_start_cleanly[${{ matrix.host }}]"

  host-yaml-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install -r tests/requirements.txt
      - name: Clean install from tests/hosts/ci-container.yml
        run: |
          pytest -q tests/integration/test_host_yaml_install.py::test_clean_install_from_versioned_host_yaml_container

  apt-rpi-zero:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # keep in sync with UBUNTU_VERSIONS in tests/integration/conftest.py
        ubuntu: ["26.04", "24.04"]
    env:
      UBUNTU_VERSION: ${{ matrix.ubuntu }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install -r tests/requirements.txt
      - name: Pi Zero apt + versioned host YAML ansible install
        run: |
          pytest tests/integration -q -n 2 -m apt

  apt-home-laptop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install -r tests/requirements.txt
      - name: Private desktop apt + versioned host config (L13 Yoga mirror)
        run: |
          pytest tests/integration -q -m apt_gnome

  unit-arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install -r tests/requirements.txt
      - name: Unit tests and Ansible syntax on ARM
        run: |
          python3 -m py_compile machine_cli/machine
          python3 -m compileall -q machine_cli
          pytest tests/unit -q
          ansible-galaxy collection install -r ansible/requirements.yml
          ansible-playbook --syntax-check -i ansible/inventory/local.yml ansible/workstation.yml
