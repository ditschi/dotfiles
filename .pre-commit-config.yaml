---
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks.git
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: (^|/)(mise\.lock|\.mise/locks/.*)$
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: (^|/)(mise\.lock|\.mise/locks/.*)$
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: (^|/)(mise\.lock|\.mise/locks/.*)$
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        args: [-e, SC1090, -e, SC1091]
        exclude_types: [zsh]
        exclude: ^openspec/changes/[^/]+/spike/
      - id: shellcheck
        name: shellcheck (rc files without shebang)
        args: [-e, SC1090, -e, SC1091]
        files: ^home/dot_(bashrc|profile)$
        types: [text]
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.10.0-2
    hooks:
      - id: shfmt
        args:
          - --indent
          - '4'
          - --case-indent
          - --simplify
          - --write
        exclude: '\.bashrc|^openspec/changes/[^/]+/spike/'
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3
  - repo: https://github.com/google/yamlfmt
    rev: v0.14.0
    hooks:
      - id: yamlfmt
        exclude: (^|/)\.mise/locks/
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args:
          - --ignore-words=.codespellignore
          - --quiet-level=2
          # - --write-changes
  - repo: local
    hooks:
      - id: gitconfig-no-host-settings
        name: move host-only Git settings to ~/.gitconfig.local
        entry: python3 -m machine_cli.local_overrides
        language: system
        files: ^home/dot_gitconfig$
        pass_filenames: false
      - id: mise-tools-declared-once
        name: mise tools are declared once (fragments and Ansible packages)
        entry: python3 -m machine_cli.mise_check
        language: python
        additional_dependencies: [pyyaml]
        files: (^|/)mise/conf\.d/.*\.toml$|^ansible/group_vars/all\.yml$
        pass_filenames: false
      - id: no-co-authored-by
        name: forbid Co-authored-by trailers in commit messages
        entry: '(?i)^co-authored-by:'
        language: pygrep
        stages: [commit-msg]
  - repo: https://github.com/pycqa/flake8
    rev: '7.1.1'
    hooks:
      - id: flake8
        args:
          - --max-line-length=120
