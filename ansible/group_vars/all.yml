---
# Profile-driven package sets (see tasks/resolve_packages.yml).
packages_base:
  - curl
  - git
  - wget
  - tmux
  - tree
  - htop
  - python3
  - python3-venv
  - python-is-python3

# Slim replacement for packages_base on profile rpi-zero.
packages_rpi_zero:
  - curl
  - git
  - tmux
  - zsh
  - fzf

# Every profile except rpi-zero and container.
packages_host:
  - eza
  - fonts-firacode
  - fonts-powerline
  - git-lfs
  - gnupg
  - libsecret-tools
  - pipx

# Profile work-laptop, and feature kerberos on other profiles.
packages_work: &packages_work
  - ldap-utils
  - krb5-user

# apt packages per feature. A feature without packages needs no entry; a new
# feature with packages only needs a line here.
packages_by_feature:
  zsh-full:
    - autojump
    - fzf
    - jq
    - luajit
    - tmux
    - zsh
  gnome:
    - flameshot
    - gnome-shell-extension-manager
    - gnome-shell-extension-prefs
    - guake
  docker:
    - docker.io
    - docker-compose-v2
  kerberos: *packages_work
  unattended-upgrades:
    - unattended-upgrades
  syncthing:
    - syncthing
  # Yoga / convertible: stylus proximity → grab touchscreen (Xournal++ workaround)
  stylus-touch-guard:
    - evtest
    - python3-evdev
    - python3-psutil
  # ThinkPad laptops: zram swap, power profiles, VA-API check tool
  thinkpad-tuning:
    - power-profiles-daemon
    - systemd-zram-generator
    - vainfo
  sshd-home:
    - openssh-server

apt_cache_valid_time: 3600

# Shared by roles that install helper scripts and systemd units.
machine_lib_dir: /usr/local/lib/machine
# False in containers (CI): files are installed, services are not started.
machine_manage_services: >-
  {{ ansible_virtualization_type | default('') not in ['docker', 'container', 'podman', 'lxc']
     and ansible_connection | default('') != 'docker' }}

# Telegraf config names (SoT). Role roles/monitoring resolves the list from
# profile + features; CLI must not duplicate this map.
monitoring_by_profile:
  home-laptop:
    - machine/base
    - machine/laptop
  home-server:
    - machine/base
    - machine/server
  rpi:
    - machine/base
    - machine/pi
  rpi-zero:
    - machine/base
    - machine/pi

# Prefer Influx Telegraf config URLs when set (from ~/.env / Bitwarden).
# Fallback: files under roles/monitoring/files/<name with / -> _>.conf
influx_telegraf_config_base: "{{ lookup('env', 'INFLUX_TELEGRAF_CONFIG_BASE') | default('', true) }}"
influx_url: "{{ lookup('env', 'INFLUX_URL') | default('', true) }}"
influx_token: "{{ lookup('env', 'INFLUX_TOKEN') | default('', true) }}"
influx_org: "{{ lookup('env', 'INFLUX_ORG') | default('', true) }}"
influx_bucket: "{{ lookup('env', 'INFLUX_BUCKET') | default('telegraf', true) }}"
influx_username: "{{ lookup('env', 'INFLUXDB_USER') | default('', true) }}"
influx_password: "{{ lookup('env', 'INFLUXDB_USER_PASSWORD') | default('', true) }}"
influx_database: "{{ lookup('env', 'INFLUXDB_DB') | default('telegraf', true) }}"
