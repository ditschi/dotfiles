---
# Package sets per hardware, context and feature (see tasks/resolve_packages.yml).
packages_base:
  - curl
  - wget
  - tree
  - htop
  - python3
  - python3-venv
  - python-is-python3

# Slim replacement for packages_base on a Raspberry Pi Zero (detected).
packages_rpi_zero:
  - curl
  - zsh

# Every host except a Pi Zero and containers.
packages_host:
  - fonts-firacode
  - fonts-powerline
  - gnupg
  - libsecret-tools
  - pipx

# Context work, and feature kerberos.
packages_work: &packages_work
  - ldap-utils
  - krb5-user

# apt packages per feature. A feature without packages needs no entry; a new
# feature with packages only needs a line here.
packages_by_feature:
  zsh-full:
    - zsh
  # VA-API check tool
  desktop:
    - vainfo
  gnome:
    - flameshot
    - gnome-shell-extension-manager
    - gnome-shell-extension-prefs
  docker:
    - docker.io
    - docker-compose-v2
  kerberos: *packages_work
  unattended-upgrades:
    - unattended-upgrades
  syncthing:
    - syncthing
  # Mail client; on Ubuntu the deb installs the snap
  thunderbird:
    - thunderbird
  # /etc as a local git repository; commits around every apt run and daily
  etckeeper:
    - etckeeper
  # Yoga / convertible: stylus proximity → grab touchscreen (Xournal++ workaround)
  stylus-touch-guard:
    - evtest
    - python3-evdev
    - python3-psutil
  # Laptops only (tasks/resolve_packages.yml drops it elsewhere)
  power-profile-switch:
    - power-profiles-daemon
  # Not on Raspberry Pis (tasks/resolve_packages.yml drops it there)
  zram-swap:
    - systemd-zram-generator
  sshd-home:
    - openssh-server

apt_cache_valid_time: 3600

# Shared by roles that install helper scripts and systemd units.
machine_lib_dir: /usr/local/lib/machine
# False in containers (CI): files are installed, services are not started.
machine_manage_services: >-
  {{ ansible_facts.virtualization_type | default('') not in ['docker', 'container', 'podman', 'lxc']
     and ansible_connection | default('') != 'docker' }}

# Telegraf config names are resolved in tasks/resolve_monitoring.yml from the detected
# hardware and the device; the CLI must not duplicate this.

# Influx values come from the Bitwarden item influxdb-telegraf-write: machine passes
# them as extra vars, which override these environment lookups (fallback only).
# Remote configs replace the local fragments when INFLUX_TELEGRAF_CONFIG_BASE is set;
# otherwise files under roles/monitoring/files/<name with / -> _>.conf are used.
influx_telegraf_config_base: "{{ lookup('env', 'INFLUX_TELEGRAF_CONFIG_BASE') | default('', true) }}"
influx_url: "{{ lookup('env', 'INFLUX_URL') | default('', true) }}"
influx_token: "{{ lookup('env', 'INFLUX_TOKEN') | default('', true) }}"
influx_org: "{{ lookup('env', 'INFLUX_ORG') | default('', true) }}"
influx_bucket: "{{ lookup('env', 'INFLUX_BUCKET') | default('telegraf', true) }}"
influx_username: "{{ lookup('env', 'INFLUXDB_USER') | default('', true) }}"
influx_password: "{{ lookup('env', 'INFLUXDB_USER_PASSWORD') | default('', true) }}"
influx_database: "{{ lookup('env', 'INFLUXDB_DB') | default('telegraf', true) }}"
