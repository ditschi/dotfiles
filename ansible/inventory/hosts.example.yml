---
# Copy to hosts.yml and encrypt:
#   cp ansible/inventory/hosts.example.yml ansible/inventory/hosts.yml
#   machine inventory encrypt ansible/inventory/hosts.yml
# Vault password: Bitwarden item ansible-vault.
#
# Desired state (features) → machine/hosts/<hostname>.yml
# This file is only connectivity (IP, user, port).
all:
  children:
    laptops:
      hosts:
        ditschi-ThinkPad-L13-Yoga-Gen-2:
          ansible_connection: local
        # Second ThinkPad: copy _example-thinkpad-copy.yml → <hostname -s>.yml
        # other-thinkpad:
        #   ansible_host: 192.168.1.x
        #   ansible_user: ditschi
    servers:
      hosts:
        homeserver:
          ansible_host: 192.168.1.4
          ansible_port: 5115
          ansible_user: ditschi
        netmaster:
          ansible_host: 192.168.1.2
          ansible_port: 5115
          ansible_user: ditschi
    rpis:
      hosts:
        netmaster:
          ansible_host: 192.168.1.2
          ansible_port: 5115
          ansible_user: ditschi
        rpi-zero-1:
          ansible_host: 192.168.1.50
          ansible_user: ditschi
    work: {}
