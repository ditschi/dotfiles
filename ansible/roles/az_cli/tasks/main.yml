---
- name: Check az installed
  ansible.builtin.command: az --version
  become: false
  environment:
    PATH: "{{ machine_user_path | default(ansible_facts.env.PATH) }}"
  register: az_cli_installed
  changed_when: false
  failed_when: false

- name: Install Azure CLI (official installer)
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://aka.ms/InstallAzureCLIDeb | bash
  args:
    executable: /bin/bash
  when: az_cli_installed.rc != 0
