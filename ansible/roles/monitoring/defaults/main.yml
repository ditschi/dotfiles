---
# Role: Telegraf agent for home profiles.
# Inputs: local fragments under files/ (default) or, with INFLUX_TELEGRAF_CONFIG_BASE,
# the remote Influx configs instead. Output from the Influx credentials (Bitwarden).

monitoring_conf_dir: /etc/telegraf/telegraf.d
monitoring_main_conf: /etc/telegraf/telegraf.conf
# Read by the upstream telegraf.service (EnvironmentFile, $TELEGRAF_OPTS).
monitoring_default_file: /etc/default/telegraf
# The service runs as this group; it must read the output files (they hold the token).
monitoring_service_group: telegraf

# InfluxData apt source; key pinned in files/influxdata-archive.asc
# (fingerprint 24C975CBA61A024EE1B631787C3D57159FC2F927).
monitoring_repo_url: https://repos.influxdata.com/debian
monitoring_keyring: /etc/apt/keyrings/influxdata-archive.asc
monitoring_source: /etc/apt/sources.list.d/influxdata.sources
