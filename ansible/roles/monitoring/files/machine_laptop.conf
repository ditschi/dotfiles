# machine/laptop — lighter interval, wireless/temp/battery when present
[agent]
  interval = "30s"

[[inputs.temp]]

[[inputs.wireless]]

# Battery: charge level, charging state, power draw (W), energy (Wh), wear.
# status is Charging / Discharging / Full / Not charging (threshold reached).
[[inputs.multifile]]
  name_override = "battery"
  base_dir = "/sys/class/power_supply/BAT0"

  [[inputs.multifile.file]]
    file = "status"
    conversion = "string"
  [[inputs.multifile.file]]
    file = "capacity"
    dest = "capacity_percent"
    conversion = "int"
  [[inputs.multifile.file]]
    file = "power_now"
    dest = "power_w"
    conversion = "float(6)"
  [[inputs.multifile.file]]
    file = "energy_now"
    dest = "energy_wh"
    conversion = "float(6)"
  [[inputs.multifile.file]]
    file = "energy_full"
    dest = "energy_full_wh"
    conversion = "float(6)"
  [[inputs.multifile.file]]
    file = "energy_full_design"
    dest = "energy_full_design_wh"
    conversion = "float(6)"
  [[inputs.multifile.file]]
    file = "voltage_now"
    dest = "voltage_v"
    conversion = "float(6)"
  [[inputs.multifile.file]]
    file = "cycle_count"
    conversion = "int"
  [[inputs.multifile.file]]
    file = "charge_control_end_threshold"
    dest = "charge_stop_percent"
    conversion = "int"
