---
# Dux PPAs (ppa:duxlabs/dux-repo, ppa:duxlabs/dms); both signed by the key pinned in
# files/duxlabs.asc.
niri_desktop_ppas:
  - name: dux-repo
    url: https://ppa.launchpadcontent.net/duxlabs/dux-repo/ubuntu
  - name: dms
    url: https://ppa.launchpadcontent.net/duxlabs/dms/ubuntu
niri_desktop_keyring: /etc/apt/keyrings/duxlabs.asc
niri_desktop_source_dir: /etc/apt/sources.list.d
# Without recommends (niri recommends alacritty and fuzzel, not needed with Ghostty and
# DMS); the recommends DMS uses are listed here.
niri_desktop_packages:
  - niri
  - dms
  - ghostty
  - gnome-keyring
  - xdg-desktop-portal-gnome
  - xdg-desktop-portal-gtk
