---
node_tools_nvm_version: v0.40.3
node_tools_nvm_dir: "{{ ansible_facts.env.NVM_DIR | default(ansible_facts.env.HOME ~ '/.nvm', true) }}"
node_tools_cli_packages:
  - feature: claude-code
    command: claude
    package: "@anthropic-ai/claude-code"
  - feature: copilot-cli
    command: copilot
    package: "@github/copilot"
