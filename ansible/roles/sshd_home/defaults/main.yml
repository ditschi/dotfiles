---
# Port and drop-in that earlier versions of the role wrote; removed on apply.
sshd_home_legacy_port: 5115
sshd_home_legacy_port_dropin: /etc/ssh/sshd_config.d/99-machine-port.conf
sshd_home_manage_authorized_keys: true
sshd_home_keys_dir: "{{ playbook_dir }}/../machine/ssh_keys"
sshd_home_authorized_keys_user: "{{ ansible_facts.user_id if ansible_facts.user_id != 'root' else (ansible_facts.env.SUDO_USER | default(ansible_facts.user_id)) }}"
sshd_home_authorized_keys_home: "/home/{{ sshd_home_authorized_keys_user }}"
