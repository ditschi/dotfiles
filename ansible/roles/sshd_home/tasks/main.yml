---
# sshd listens on the default port 22. Earlier versions of this role moved it to
# 5115; remove what they wrote so those hosts go back to 22.
- name: Remove legacy sshd port drop-in
  ansible.builtin.file:
    path: "{{ sshd_home_legacy_port_dropin }}"
    state: absent
  notify: Reload sshd

- name: Remove legacy Port line from main sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^Port\s+{{ sshd_home_legacy_port }}\s*$'
    state: absent
    backup: true
  notify: Reload sshd
  when: ansible_facts.virtualization_type | default('') not in ['docker', 'container', 'podman', 'lxc']

- name: Validate sshd configuration
  ansible.builtin.command: sshd -t
  changed_when: false
  when:
    - ansible_facts.virtualization_type | default('') not in ['docker', 'container', 'podman', 'lxc']
    - ansible_connection | default('') != 'docker'

- name: Build list of present pubkey files for ssh_allow_from
  ansible.builtin.stat:
    path: "{{ sshd_home_keys_dir }}/{{ item }}.pub"
  loop: "{{ ssh_allow_from | default([]) }}"
  register: sshd_home_key_stats
  when:
    - sshd_home_manage_authorized_keys | bool
    - (ssh_allow_from | default([])) | length > 0
  delegate_to: localhost
  become: false

- name: Warn on missing machine/ssh_keys entries
  ansible.builtin.debug:
    msg: "missing machine/ssh_keys/{{ item.item }}.pub — not added to authorized_keys"
  loop: "{{ sshd_home_key_stats.results | default([]) }}"
  when:
    - sshd_home_manage_authorized_keys | bool
    - item.stat is defined
    - not item.stat.exists
  loop_control:
    label: "{{ item.item | default('?') }}"

- name: Ensure ~/.ssh for login user
  ansible.builtin.file:
    path: "{{ sshd_home_authorized_keys_home }}/.ssh"
    state: directory
    mode: "0700"
    owner: "{{ sshd_home_authorized_keys_user }}"
    group: "{{ sshd_home_authorized_keys_user }}"
  when:
    - sshd_home_manage_authorized_keys | bool
    - (ssh_allow_from | default([])) | length > 0
    - sshd_home_authorized_keys_user | length > 0

- name: Install authorized_keys from machine/ssh_keys
  ansible.posix.authorized_key:
    user: "{{ sshd_home_authorized_keys_user }}"
    key: "{{ lookup('file', item.stat.path) }}"
    state: present
    exclusive: false
  loop: "{{ sshd_home_key_stats.results | default([]) }}"
  when:
    - sshd_home_manage_authorized_keys | bool
    - item.stat is defined
    - item.stat.exists
    - sshd_home_authorized_keys_user | length > 0
  loop_control:
    label: "{{ item.item | default('?') }}"
