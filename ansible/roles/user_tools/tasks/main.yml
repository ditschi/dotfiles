---
- name: Ensure ~/.local/bin exists
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.local/bin"
    state: directory
    mode: "0755"

- name: Check starship
  ansible.builtin.command: starship --version
  register: user_tools_starship_version
  changed_when: false
  failed_when: false

- name: Install starship into ~/.local/bin
  ansible.builtin.shell: |
    curl -fsSL https://starship.rs/install.sh | sh -s -- -y --bin-dir "{{ ansible_facts.env.HOME }}/.local/bin"
  args:
    executable: /bin/bash
  when:
    - "'starship' in (features | default([]))"
    - user_tools_starship_version.rc != 0

- name: Check eza
  ansible.builtin.command: eza --version
  environment:
    PATH: "{{ machine_user_path | default(ansible_facts.env.PATH) }}"
  register: user_tools_eza_version
  changed_when: false
  failed_when: false

# Not packaged on older Ubuntu; the static musl build runs on any glibc.
- name: Install eza into ~/.local/bin
  ansible.builtin.unarchive:
    src: "https://github.com/eza-community/eza/releases/latest/download/eza_{{ ansible_facts.architecture }}-unknown-linux-{{ 'musl' if ansible_facts.architecture == 'x86_64' else 'gnu' }}.tar.gz"
    dest: "{{ ansible_facts.env.HOME }}/.local/bin"
    remote_src: true
    mode: "0755"
  when:
    - ansible_facts.architecture in ['x86_64', 'aarch64']
    - user_tools_eza_version.rc != 0
  ignore_errors: true

- name: Ensure user font directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.local/share/fonts"
    state: directory
    mode: "0755"
  when: "'fonts' in (features | default([]))"

- name: Check MesloLGS NF
  ansible.builtin.stat:
    path: "{{ ansible_facts.env.HOME }}/.local/share/fonts/MesloLGS NF Regular.ttf"
  register: user_tools_meslo_font
  when: "'fonts' in (features | default([]))"

- name: Download MesloLGS NF for p10k
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ ansible_facts.env.HOME }}/.local/share/fonts/{{ item.name }}"
    mode: "0644"
  loop:
    - name: MesloLGS NF Regular.ttf
      url: https://github.com/romkatv/powerlevel10k-media/raw/master/MesloLGS%20NF%20Regular.ttf
    - name: MesloLGS NF Bold.ttf
      url: https://github.com/romkatv/powerlevel10k-media/raw/master/MesloLGS%20NF%20Bold.ttf
    - name: MesloLGS NF Italic.ttf
      url: https://github.com/romkatv/powerlevel10k-media/raw/master/MesloLGS%20NF%20Italic.ttf
    - name: MesloLGS NF Bold Italic.ttf
      url: https://github.com/romkatv/powerlevel10k-media/raw/master/MesloLGS%20NF%20Bold%20Italic.ttf
  when:
    - "'fonts' in (features | default([]))"
    - not (user_tools_meslo_font.stat.exists | default(false))

- name: Rebuild font cache
  ansible.builtin.command: fc-cache -f
  changed_when: false
  when:
    - "'fonts' in (features | default([]))"
    - not (user_tools_meslo_font.stat.exists | default(false))
