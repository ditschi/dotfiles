---
- name: Start zram swap
  ansible.builtin.systemd:
    name: systemd-zram-setup@zram0.service
    state: restarted
    daemon_reload: true
  when: machine_manage_services | bool

- name: Apply zram sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true
  when: machine_manage_services | bool
