---
# Single source: derive Telegraf config names from hardware, device and features.
# Do not compute this list in the machine CLI.

- name: Detect hardware facts
  ansible.builtin.include_tasks: detect_hardware.yml
  when: hw_laptop is not defined

- name: Clear monitoring configs when feature is off
  ansible.builtin.set_fact:
    monitoring_configs: []
  when: "'monitoring' not in machine_features"

- name: Monitoring configs from hardware and device
  ansible.builtin.set_fact:
    monitoring_configs: >-
      {{ ['machine/base']
         + (['machine/laptop'] if hw_laptop | bool else [])
         + (['machine/pi'] if hw_pi | bool else [])
         + (['machine/server'] if device | default('') == 'server' and not (hw_pi | bool) else [])
         + (['machine/smart'] if monitoring_smart else []) }}
  vars:
    # SMART needs real disks: not in VMs, containers or on a Pi; the remote configs have none.
    monitoring_smart: >-
      {{ not (hw_virtual | default(false) | bool)
         and not (hw_pi | bool)
         and device | default('') != 'container'
         and (ansible_facts.virtualization_type | default('')) not in ['docker', 'container', 'podman', 'lxc']
         and influx_telegraf_config_base | default('') | length == 0 }}
  when: "'monitoring' in machine_features"

- name: Add docker monitoring fragment
  ansible.builtin.set_fact:
    monitoring_configs: "{{ monitoring_configs + ['machine/docker'] }}"
  when:
    - "'monitoring' in machine_features"
    - "'docker' in machine_features"
