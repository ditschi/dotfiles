---
- name: Detect hardware facts
  ansible.builtin.include_tasks: detect_hardware.yml
  when: hw_pi_zero is not defined

- name: Start from slim Pi Zero package set
  ansible.builtin.set_fact:
    install_packages: "{{ packages_rpi_zero }}"
  when: hw_pi_zero | bool

- name: Start from base package set
  ansible.builtin.set_fact:
    install_packages: "{{ packages_base }}"
  when: not (hw_pi_zero | bool)

- name: Add host packages
  ansible.builtin.set_fact:
    install_packages: "{{ install_packages + packages_host }}"
  when:
    - not (hw_pi_zero | bool)
    - device | default('') != 'container'

- name: Add work packages
  ansible.builtin.set_fact:
    install_packages: "{{ install_packages + packages_work }}"
  when: context | default('') == 'work'

- name: Add packages of the selected features
  ansible.builtin.set_fact:
    install_packages: >-
      {{ install_packages
         + (packages_by_feature | dict2items
            | selectattr('key', 'in', machine_features | difference(machine_features_not_here))
            | map(attribute='value') | flatten) }}
  vars:
    # Features whose role does not run on this hardware bring no packages either.
    machine_features_not_here: >-
      {{ ([] if hw_laptop | bool else ['lid-switch', 'power-profile-switch', 'battery-charge-limit'])
         + (['zram-swap'] if hw_pi | bool else []) }}

- name: Warn when Cosmic selected on non-Pop
  ansible.builtin.debug:
    msg: >-
      Feature cosmic is selected but it has no packages on this OS;
      desktop session will not be installed here.
  when:
    - "'cosmic' in machine_features"
    - (packages_by_feature.cosmic | default([]) | length) == 0
