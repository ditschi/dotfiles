---
- name: Workstation packages
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true
  tags: [packages]
  tasks:
    - name: Resolve package list from hardware, context and features
      ansible.builtin.include_tasks: tasks/resolve_packages.yml

    - name: Preserve the installed Docker provider
      when: "'docker' in machine_features"
      block:
        # dpkg-query instead of package_facts: the uv-installed Ansible has no apt bindings.
        - name: Inspect installed Docker packages
          ansible.builtin.shell: >-
            dpkg-query -W -f='${db:Status-Status} ${Package}\n'
            docker-ce docker.io moby-engine 2>/dev/null
            | awk '$1 == "installed" { print $2 }'
          args:
            executable: /bin/sh
          register: machine_docker_packages
          changed_when: false
          failed_when: false

        - name: Check existing Docker CLI as the login user
          ansible.builtin.command: docker --version
          become: false
          environment:
            PATH: "{{ machine_user_path | default(ansible_facts.env.PATH) }}"
          register: machine_docker
          changed_when: false
          failed_when: false

        - name: Check existing Compose capability
          ansible.builtin.command: docker compose version
          become: false
          environment:
            PATH: "{{ machine_user_path | default(ansible_facts.env.PATH) }}"
          register: machine_compose
          changed_when: false
          failed_when: false

        - name: Avoid replacing existing Docker packages or custom executables
          ansible.builtin.set_fact:
            install_packages: "{{ install_packages | difference(packages_by_feature.docker) }}"
          when: >-
            machine_docker.rc == 0 or 'docker-ce' in machine_docker_packages.stdout_lines
            or 'docker.io' in machine_docker_packages.stdout_lines or 'moby-engine' in machine_docker_packages.stdout_lines

        - name: Add only a missing provider-compatible Compose package
          ansible.builtin.set_fact:
            install_packages: "{{ install_packages + ['docker-compose-plugin' if 'docker-ce' in machine_docker_packages.stdout_lines else 'docker-compose-v2'] }}"
          when:
            - machine_compose.rc != 0
            - "'docker-ce' in machine_docker_packages.stdout_lines or 'docker.io' in machine_docker_packages.stdout_lines"

        - name: Report unmanaged Docker installations lacking Compose
          ansible.builtin.debug:
            msg: "Existing Docker preserved; install Compose from its provider manually. No engine, context or group changes made."
          when:
            - machine_docker.rc == 0
            - machine_compose.rc != 0
            - "'docker-ce' not in machine_docker_packages.stdout_lines and 'docker.io' not in machine_docker_packages.stdout_lines"

    - name: Install Docker only where a package exists for this architecture
      when:
        - "'docker' in machine_features"
        - ansible_facts.os_family == "Debian"
        - (packages_by_feature.docker | intersect(install_packages)) | length > 0
      block:
        - name: Refresh the apt cache
          ansible.builtin.apt:
            update_cache: true
            cache_valid_time: "{{ apt_cache_valid_time | default(3600) }}"

        - name: Look up the Docker package candidate
          ansible.builtin.command: apt-cache policy docker.io
          register: machine_docker_candidate
          changed_when: false
          failed_when: false

        - name: Skip Docker without a package for this architecture
          ansible.builtin.set_fact:
            install_packages: "{{ install_packages | difference(packages_by_feature.docker) }}"
          when: >-
            'Candidate:' not in machine_docker_candidate.stdout
            or 'Candidate: (none)' in machine_docker_candidate.stdout

        - name: Report skipped Docker
          ansible.builtin.debug:
            msg: "Docker has no package for {{ ansible_facts.architecture }}; skipped."
          when: >-
            'Candidate:' not in machine_docker_candidate.stdout
            or 'Candidate: (none)' in machine_docker_candidate.stdout

    - name: Install workstation packages
      ansible.builtin.apt:
        name: "{{ install_packages | unique }}"
        state: present
        cache_valid_time: "{{ apt_cache_valid_time | default(3600) }}"
      when: ansible_facts.os_family == "Debian" and (install_packages | default([])) | length > 0

- name: COSMIC desktop (Ubuntu via PPA)
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true
  tags: [cosmic]
  roles:
    - role: cosmic_desktop
      when: "'cosmic' in machine_features"

- name: Monitoring (Telegraf)
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true
  tags: [monitoring]
  pre_tasks:
    - name: Resolve monitoring config names from hardware, device and features
      ansible.builtin.include_tasks: tasks/resolve_monitoring.yml
  roles:
    - role: monitoring
      when:
        - "'monitoring' in machine_features"
        - (monitoring_configs | default([])) | length > 0

- name: Stylus touch-guard (Yoga / convertible)
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true
  tags: [stylus]
  roles:
    - role: stylus_touch_guard
      when: "'stylus-touch-guard' in machine_features"

- name: Lid switch (laptops)
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true
  tags: [laptop]
  pre_tasks:
    - name: Detect hardware facts
      ansible.builtin.include_tasks: tasks/detect_hardware.yml
      when: hw_model_l13_yoga_gen2 is not defined
  roles:
    - role: lid_switch
      when:
        - "'lid-switch' in machine_features"
        - hw_laptop | bool

- name: Power profile per power source (laptops)
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true
  tags: [laptop]
  pre_tasks:
    - name: Detect hardware facts
      ansible.builtin.include_tasks: tasks/detect_hardware.yml
      when: hw_model_l13_yoga_gen2 is not defined
  roles:
    - role: power_profile_switch
      when:
        - "'power-profile-switch' in machine_features"
        - hw_laptop | bool

- name: Battery charge limit (laptops)
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true
  tags: [laptop]
  pre_tasks:
    - name: Detect hardware facts
      ansible.builtin.include_tasks: tasks/detect_hardware.yml
      when: hw_model_l13_yoga_gen2 is not defined
  roles:
    - role: battery_charge_limit
      when:
        - "'battery-charge-limit' in machine_features"
        - hw_laptop | bool

- name: zram swap (not on Raspberry Pis)
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true
  tags: [zram]
  pre_tasks:
    - name: Detect hardware facts
      ansible.builtin.include_tasks: tasks/detect_hardware.yml
      when: hw_model_l13_yoga_gen2 is not defined
  roles:
    - role: zram_swap
      when:
        - "'zram-swap' in machine_features"
        - not (hw_pi | bool)

- name: ThinkPad L13 Yoga Gen 2 (detected model)
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true
  tags: [model]
  pre_tasks:
    - name: Detect hardware facts
      ansible.builtin.include_tasks: tasks/detect_hardware.yml
      when: hw_model_l13_yoga_gen2 is not defined
  roles:
    - role: thinkpad_l13_yoga_gen2
      when:
        - hw_model_l13_yoga_gen2 | bool

- name: Touch device (GNOME extensions for the login user)
  hosts: "{{ target_hosts | default('all') }}"
  become: false
  gather_facts: true
  tags: [touch]
  roles:
    - role: touch_device
      when: "'touch-device' in machine_features"

- name: SSH port + authorized_keys (home fleet)
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true
  tags: [sshd]
  roles:
    - role: sshd_home
      when: "'sshd-home' in machine_features"
