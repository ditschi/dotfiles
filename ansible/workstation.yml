---
- name: Workstation packages
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true
  tags: [packages]
  tasks:
    - name: Resolve package list from profile features
      ansible.builtin.include_tasks: tasks/resolve_packages.yml

    - name: Preserve the installed Docker provider
      when: "'docker' in (features | default([]))"
      block:
        - name: Inspect installed package providers
          ansible.builtin.package_facts:
            manager: auto

        - name: Check existing Docker CLI as the login user
          ansible.builtin.command: docker --version
          become: false
          environment:
            PATH: "{{ machine_user_path | default(ansible_env.PATH) }}"
          register: machine_docker
          changed_when: false
          failed_when: false

        - name: Check existing Compose capability
          ansible.builtin.command: docker compose version
          become: false
          environment:
            PATH: "{{ machine_user_path | default(ansible_env.PATH) }}"
          register: machine_compose
          changed_when: false
          failed_when: false

        - name: Avoid replacing existing Docker packages or custom executables
          ansible.builtin.set_fact:
            install_packages: "{{ install_packages | difference(packages_by_feature.docker) }}"
          when: >-
            machine_docker.rc == 0 or 'docker-ce' in ansible_facts.packages
            or 'docker.io' in ansible_facts.packages or 'moby-engine' in ansible_facts.packages

        - name: Add only a missing provider-compatible Compose package
          ansible.builtin.set_fact:
            install_packages: "{{ install_packages + ['docker-compose-plugin' if 'docker-ce' in ansible_facts.packages else 'docker-compose-v2'] }}"
          when:
            - machine_compose.rc != 0
            - "'docker-ce' in ansible_facts.packages or 'docker.io' in ansible_facts.packages"

        - name: Report unmanaged Docker installations lacking Compose
          ansible.builtin.debug:
            msg: "Existing Docker preserved; install Compose from its provider manually. No engine, context or group changes made."
          when:
            - machine_docker.rc == 0
            - machine_compose.rc != 0
            - "'docker-ce' not in ansible_facts.packages and 'docker.io' not in ansible_facts.packages"

    - name: Install workstation packages
      ansible.builtin.apt:
        name: "{{ install_packages | unique }}"
        state: present
        cache_valid_time: "{{ apt_cache_valid_time | default(3600) }}"
      when: ansible_os_family == "Debian" and (install_packages | default([])) | length > 0

- name: User-level tools
  hosts: "{{ target_hosts | default('all') }}"
  become: false
  gather_facts: true
  tags: [user_tools]
  roles:
    - role: user_tools
      when: profile | default('') != 'container'

- name: Monitoring (Telegraf)
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true
  tags: [monitoring]
  pre_tasks:
    - name: Resolve monitoring config names from profile features
      ansible.builtin.include_tasks: tasks/resolve_monitoring.yml
  roles:
    - role: monitoring
      when:
        - "'monitoring' in (features | default([]))"
        - profile | default('') not in ['container', 'work-laptop']
        - (monitoring_configs | default([])) | length > 0

- name: Yazi (terminal file manager)
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true
  tags: [yazi]
  roles:
    - role: yazi
      when: "'yazi' in (features | default([]))"

- name: GitHub CLI
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true
  tags: [gh_cli]
  roles:
    - role: gh_cli
      when: "'gh-cli' in (features | default([]))"

- name: Azure CLI (work)
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true
  tags: [az_cli]
  roles:
    - role: az_cli
      when: "'azure-cli' in (features | default([]))"

- name: Stylus touch-guard (Yoga / convertible)
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true
  tags: [stylus]
  roles:
    - role: stylus_touch_guard
      when: "'stylus-touch-guard' in (features | default([]))"

- name: ThinkPad tuning (battery, power profile, suspend, zram, tablet mode)
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true
  tags: [thinkpad]
  roles:
    - role: thinkpad_tuning
      when: "'thinkpad-tuning' in (features | default([]))"

- name: Touch device (GNOME extensions for the login user)
  hosts: "{{ target_hosts | default('all') }}"
  become: false
  gather_facts: true
  tags: [touch]
  roles:
    - role: touch_device
      when: "'touch-device' in (features | default([]))"

- name: SSH port + authorized_keys (home fleet)
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true
  tags: [sshd]
  roles:
    - role: sshd_home
      when:
        - "'sshd-home' in (features | default([]))"
        - profile | default('') not in ['container', 'work-laptop']
