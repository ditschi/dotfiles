# Other user-space tools, on every host. uv also installs the Azure CLI as a uv tool
# (feature azure-cli, see machine_cli/mise_tools.py), so no mise-managed Python is on PATH.
[tools]
gh = "latest"
yazi = "latest"
node = "lts"
uv = "latest"
# Bitwarden CLI (bw), official release build for x64 and arm64; used by machine env pull,
# the SSH key backup and the Influx credentials (spec secret-tools).
# Pinned: 2026.10.1 fails against Vaultwarden 2026.6.0 (404 on the user key id backfill
# after login); 2026.8.0 works with it. Raise only after checking against the server.
bitwarden = "2026.8.0"
