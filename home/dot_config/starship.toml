# Shared prompt for zsh and bash. The prompt character comes from the shell module, so its
# colour shows the shell (zsh green, bash purple); 🐳 marks a container. A failed command
# shows in the status segment.
format = """
$directory$git_branch$git_status$fill$env_var$status$python$cmd_duration$time
$container$shell
"""

add_newline = false

[directory]
format = "[$path]($style) "
truncation_length = 3
truncate_to_repo = false

[git_branch]
format = "[$branch]($style) "

[git_status]
format = "([$all_status$ahead_behind]($style) )"

[env_var.DOTFILES_UPDATE_SEGMENT]
format = "[$env_value]($style) "
style = "yellow"

[fill]
symbol = "─"

[status]
disabled = false
format = "[$symbol$common_meaning$signal_name]($style) "
map_symbol = true
recognize_signal_code = true
symbol = "✘ "
sigint_symbol = "INT "

[python]
format = "[$symbol$virtualenv]($style) "
symbol = "Py "

[cmd_duration]
min_time = 0
format = "[$duration]($style) "

[time]
disabled = false
time_format = "%H:%M:%S"
format = "[$time]($style) "

[container]
format = "[$symbol]($style)"
symbol = "🐳 "

[shell]
disabled = false
format = "$indicator "
zsh_indicator = "[❯](bold green)"
bash_indicator = "[❯](bold purple)"
unknown_indicator = "[❯](bold yellow)"

[character]
disabled = true
