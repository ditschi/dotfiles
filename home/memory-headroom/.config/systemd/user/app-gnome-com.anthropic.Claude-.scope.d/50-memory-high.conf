# Feature memory-headroom: slow the Claude desktop app down instead of letting it be killed.
# Above MemoryHigh the kernel reclaims the app's memory into swap first (slower, never killed).
# OOMPolicy=continue keeps the app running when the kernel OOM killer ends one of its
# processes (for example a test run started by Claude Code); "stop" would end the whole scope.
[Scope]
MemoryHigh=8G
OOMPolicy=continue
