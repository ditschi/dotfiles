# Shared prompt for zsh and bash. The colour of the prompt character shows the shell and the
# last exit status: zsh green / red, bash blue / orange. Starship has no module for both, so
# the shells export one of the DOTFILES_PROMPT_* variables before each prompt (from
# STARSHIP_CMD_STATUS) and one env_var module per state draws the character. Other shells
# fall back to the shell module. 🐳 marks a container; a failed command also shows in the
# status segment. user@host appears only over SSH (and the user name in a root shell).
format = """
$directory$git_branch$git_status$fill${env_var.DOTFILES_UPDATE_SEGMENT}${env_var.DOTFILES_DISK_SEGMENT}$status$python$cmd_duration($username$hostname )$time
$container${env_var.prompt_zsh}${env_var.prompt_zsh_err}${env_var.prompt_bash}${env_var.prompt_bash_err}$shell
"""

add_newline = false

[directory]
format = "[$path]($style) "
truncation_length = 3
truncate_to_repo = false

[git_branch]
format = "[$branch]($style) "

[git_status]
format = "([$all_status$ahead_behind]($style) )"

[env_var.DOTFILES_UPDATE_SEGMENT]
format = "[$env_value]($style) "
style = "yellow"

[env_var.DOTFILES_DISK_SEGMENT]
format = "[$env_value]($style) "
style = "red"

[env_var.prompt_zsh]
variable = "DOTFILES_PROMPT_ZSH"
format = "[❯](bold green) "

[env_var.prompt_zsh_err]
variable = "DOTFILES_PROMPT_ZSH_ERR"
format = "[❯](bold red) "

[env_var.prompt_bash]
variable = "DOTFILES_PROMPT_BASH"
format = "[❯](bold blue) "

[env_var.prompt_bash_err]
variable = "DOTFILES_PROMPT_BASH_ERR"
format = "[❯](bold 208) "

[fill]
symbol = "─"

[status]
disabled = false
format = "[$symbol$common_meaning$signal_name]($style) "
map_symbol = true
recognize_signal_code = true
symbol = "✘ "
sigint_symbol = "INT "

[python]
format = "[$symbol$virtualenv]($style) "
symbol = "Py "

[cmd_duration]
min_time = 0
format = "[$duration]($style) "

# Like the former p10k context segment: shown over SSH, and the user name also as root.
[username]
format = "[$user]($style)"
style_user = "180"
style_root = "bold 178"

[hostname]
ssh_only = true
format = "[@$hostname]($style)"
style = "180"

[time]
disabled = false
time_format = "%H:%M:%S"
format = "[$time]($style) "

[container]
format = "[$symbol]($style)"
symbol = "🐳 "

# Only for shells without the hook; zsh and bash draw the character via env_var above.
[shell]
disabled = false
format = "$indicator"
zsh_indicator = ""
bash_indicator = ""
unknown_indicator = "[❯](bold yellow) "

[character]
disabled = true
