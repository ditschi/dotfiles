# Same proxy as the work shell module (.shell/work/common/environment.sh), which background
# jobs do not load; without it the update job cannot reach GitHub on work hosts.
[Service]
Environment=http_proxy=http://localhost:3128 https_proxy=http://localhost:3128
Environment=HTTP_PROXY=http://localhost:3128 HTTPS_PROXY=http://localhost:3128
Environment=no_proxy=localhost,127.0.0.1,172.17.0.*,192.168.*,bosch.com,inside.bosch.cloud
Environment=NO_PROXY=localhost,127.0.0.1,172.17.0.*,192.168.*,bosch.com,inside.bosch.cloud
