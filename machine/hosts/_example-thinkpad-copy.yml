---
# Second home ThinkPad — copy of L13 Yoga Gen 2.
# Rename to <hostname -s>.yml after first boot, then: machine profile sync
# Drop stylus-touch-guard if the machine is not a Yoga/convertible.
profile: home-laptop
features:
  - zsh-full
  - fonts
  - starship
  - desktop
  - gnome
  - monitoring
  - ssh-host-key
  - stylus-touch-guard
ssh_allow_from: []
