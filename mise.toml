# Dotfile groups: each is a directory under home/ that `mise dot apply` links into $HOME.
# A host selects its groups in ~/.config/mise/config.local.toml (written by `machine`).
[dotfile_groups.core]
root = "home/core"

[dotfile_groups.prompt]
root = "home/prompt"

[dotfile_groups.systemd]
root = "home/systemd"

[dotfile_groups.work]
root = "home/work"

[dotfile_groups.fonts]
root = "home/fonts"

[dotfile_groups.thunderbird]
root = "home/thunderbird"

[dotfile_groups.claude]
root = "home/claude"

[dotfile_groups.copilot]
root = "home/copilot"

[dotfile_groups.opencode]
root = "home/opencode"

[dotfile_groups.openspec]
root = "home/openspec"

[dotfile_groups.gnome]
root = "home/gnome"

[dotfile_groups.cosmic]
root = "home/cosmic"
