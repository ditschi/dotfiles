---
schema: spec-driven
githubCopilot:
  cloudAgent: false

# Constraints an agent cannot infer from the code. Facts about the code live in Readme.md and docs/.
context: |
  Personal dotfiles + machine setup for one owner, shared by work and private hosts.
  Secrets and host-only Git settings must never be committed.
  Hosts have a context (private, work) and a device (desktop, server, container);
  hardware is detected by Ansible. Changes must keep work and private hosts working.
  Root is assumed on every host; a host config with `ansible: false` skips Ansible.

  When adding a command-line tool in a feature or group, check whether it provides
  Bash or Zsh completion and whether that completion has shell-framework
  prerequisites. Include enabling and testing it in the change; document optional
  prerequisites and handle their absence without shell startup errors. If the tool
  provides neither completion, note that no supported completion is available.

  Artifacts are self-contained and read as the lasting record of intent. Content in
  proposal Why, design Decisions and specs is owner-confirmed because the owner was
  asked; do not tag it. Anything unconfirmed goes only under an explicit Open Questions
  or Assumptions section, never stated as fact.

  Git history and legacy records are evidence, not wording. Commits are incremental
  steps toward a result and are often badly worded. Abstract the intended behaviour or
  outcome, propose the most plausible motivation in clean prose, and have the owner
  confirm or reword it before it is written as fact.

  Where to work: the live checkout is the path `machine repo` prints - files in $HOME
  are symlinks into it and the host's shell, `machine` and mise read it directly. The
  current checkout is live when `git rev-parse --show-toplevel` prints the same path;
  any other checkout (a worktree or another clone, wherever it is) is not live, and
  when `machine repo` fails no checkout on this host is live. In a checkout that is
  not live, keep working there and never create another worktree from it. Work in the
  live checkout only when the change definitely cannot affect the host's shell or
  tools, not even in a new session (e.g. only openspec/, docs/, tests/, Readme.md).
  Everything else (home/, machine_cli/, bootstrap, mise.toml, ansible/, ...) is made
  in a git worktree on branch `<change-name>`, created with an absolute path:
  `git worktree add "$(machine repo)/.worktrees/<change-name>" -b <change-name>`;
  `.worktrees/` is gitignored. When in doubt, use a worktree. Decide before the first
  artifact is written, so the change directory lives in the same checkout as its
  implementation.

  Open questions (every artifact and explore/propose/update conversations): ask
  unresolved questions and history-derived motivations with the ask_user form, not
  prose - one selectable option per answer (confirm / reword / reject for proposed
  wordings), the recommended option as default, plus a choice to confirm all
  recommendations. Write confirmed answers as plain prose; leave unanswered ones
  under Open Questions.

rules:
  proposal:
    - The Why states only motivation confirmed by the owner, in clean prose. For motivation inferred from history, propose a wording and ask before writing it; otherwise list it as an assumption.
    - Name the affected capabilities and profiles.
    - State where the change is made - the live checkout or worktree `$(machine repo)/.worktrees/<change-name>` - and why.
  design:
    - List alternatives that were considered and why they were rejected, as stated by the owner.
    - Record lasting decisions and their rationale in plain prose, so the archived design.md serves as the decision record.
  tasks:
    - Include validation scoped to the changed behavior and known consumers. A focused test subset is sufficient for a bounded change with clear coverage; documentation-only edits need no pytest run unless they affect executable examples or test configuration.
    - Require pytest tests/unit -q when impact is broad or uncertain, shared infrastructure or cross-module contracts change, test configuration changes, or focused failures suggest wider effects. If suitable coverage cannot be identified confidently, default to the full unit suite.
    - Include pre-commit run --files for changed paths, including untracked additions; use --all-files when hook configuration changes or repository-wide checks are needed. Include affected integration tests for deployment or system boundaries and ansible-lint ansible/*.yml for Ansible changes.
    - Record validation commands, results and why the selection covers the change. Rerun after relevant edits, not merely because another workflow step started.
    - Before archiving, run `openspec validate --strict --type spec` from the checkout root and treat warnings as blockers, even when they are in specs outside the current change.

operations:
  apply:
    guidance:
      - Before editing, check the proposal's stated checkout. For a worktree, work only inside `$(machine repo)/.worktrees/<change-name>` (create it with `git worktree add "$(machine repo)/.worktrees/<change-name>" -b <change-name>` if missing) and never edit the same files in the live checkout.
  archive:
    guidance:
      - For a worktree change, archive inside the worktree, then ask the owner before merging the branch into the live checkout and before removing the worktree.
      - If the change introduced or altered a lasting design decision, make sure the archived design.md states the decision and its rationale in plain prose.
      - 'Default post-archive path: archive, run checks, commit, merge to main and push main in one guided flow. Offer split steps only as an explicit alternative.'
      - 'Do not offer "archive + check" as the default when a merge-ready branch can be completed in one flow.'
      - 'Required pre-archive checks are: (1) `openspec validate --strict --type spec`; (2) the targeted validations listed in the change tasks that cover changed behavior and known consumers.'
      - 'Do not rerun the full test suite by default when those targeted checks already passed after the last relevant edit.'
      - 'After merge to main and before push, rerun only targeted risk checks when the merge changed conflict resolutions, touched shared infrastructure or changed validation/test config; otherwise continue to push and rely on CI for rare side effects.'
      - 'If post-merge checks find issues, fix them before push.'
