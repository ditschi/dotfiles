---
schema: spec-driven
githubCopilot:
  cloudAgent: false

# Constraints an agent cannot infer from the code. Facts about the code live in Readme.md and docs/.
context: |
  Personal dotfiles + machine setup for one owner, shared by work and private hosts.
  Secrets and host-only Git settings must never be committed.
  Hosts have a context (private, work) and a device (desktop, server, container);
  hardware is detected by Ansible. Changes must keep work and private hosts working.
  Root is assumed on every host; a host config with `ansible: false` skips Ansible.

  When adding a command-line tool in a feature or group, check whether it provides
  Bash or Zsh completion and whether that completion has shell-framework
  prerequisites. Include enabling and testing it in the change; document optional
  prerequisites and handle their absence without shell startup errors. If the tool
  provides neither completion, note that no supported completion is available.

  Artifacts are self-contained and read as the lasting record of intent. Content in
  proposal Why, design Decisions and specs is owner-confirmed because the owner was
  asked; do not tag it. Anything unconfirmed goes only under an explicit Open Questions
  or Assumptions section, never stated as fact.

  Git history and legacy records are evidence, not wording. Commits are incremental
  steps toward a result and are often badly worded. Abstract the intended behaviour or
  outcome, propose the most plausible motivation in clean prose, and have the owner
  confirm or reword it before it is written as fact.

  Where to work: follow "Planning changes (OpenSpec)" in AGENTS.md. Decide the
  checkout before the first artifact is written, so the change directory lives in the
  same checkout as its implementation.

  Open questions (every artifact and explore/propose/update conversations): ask
  unresolved questions and history-derived motivations with the ask_user form, not
  prose - one selectable option per answer (confirm / reword / reject for proposed
  wordings), the recommended option as default, plus a choice to confirm all
  recommendations. Write confirmed answers as plain prose; leave unanswered ones
  under Open Questions.

rules:
  proposal:
    - The Why states only motivation confirmed by the owner, in clean prose. For motivation inferred from history, propose a wording and ask before writing it; otherwise list it as an assumption.
    - Name the affected capabilities and profiles.
    - State where the change is made - the live checkout or worktree `$(machine repo)/.worktrees/<change-name>` - and why.
  design:
    - List alternatives that were considered and why they were rejected, as stated by the owner.
    - Record lasting decisions and their rationale in plain prose, so the archived design.md serves as the decision record.
  specs:
    - Keep each requirement to one behavior and under about 500 characters. When a MODIFIED requirement would grow past that or extends an enumerated list, split it into separate requirements or move the items into scenarios instead of appending.
  tasks:
    - 'Choose validation by the "Validation" rules in AGENTS.md and list it in the order it runs: targeted checks for the changed behavior and known consumers, then `pre-commit run --files <changed paths>`, then `openspec validate <change-name> --strict`. Add escalated checks only where those rules call for them.'
    - 'End with a review task only when the change touches shared infrastructure (machine_cli core or update flow, bootstrap, test, validation or pre-commit config, shared Ansible tasks or roles), changes several capabilities, or needed escalated validation: review the branch diff against main with a fresh reviewer (`/review` or a review subagent) and fix findings before archive. Omit it for narrow changes.'

operations:
  apply:
    guidance:
      - Before editing, check the proposal's stated checkout. For a worktree, work only inside `$(machine repo)/.worktrees/<change-name>` (create it with `git worktree add "$(machine repo)/.worktrees/<change-name>" -b <change-name>` if missing) and never edit the same files in the live checkout.
      - After the last task and its validation pass, offer the archive flow with its option 1 instead of stopping.
  archive:
    guidance:
      - 'Ask once. Offer as option 1 (recommended) the full flow below, then archive + commit and archive only as alternatives. Option 1 includes the spec sync, so do not ask the sync question separately unless a capability is sync-blocked. Choosing option 1 approves the push; ask again only when a check fails or a conflict needs a decision.'
      - '1. Pre-archive: confirm the validation tasks passed after the last relevant edit. Do not rerun them or the full suite.'
      - '2. Archive with spec sync in the checkout that holds the change; for a worktree change, inside the worktree.'
      - '3. Post-sync gate: run `openspec validate --specs --strict --no-interactive` and treat every warning as a blocker, also in specs the change did not touch. The sync can push a merged requirement over the limits that the change validation passed; fix by splitting requirements or moving detail into scenarios, then rerun.'
      - '4. If the change introduced or altered a lasting design decision, make sure the archived design.md states the decision and its rationale in plain prose.'
      - '5. Commit the archive and the spec sync. For a change made in the live checkout, push main now and stop.'
      - '6. Integrate main in the worktree, not in the live checkout: `git fetch`, then rebase the branch onto `origin/main`. Rerun the affected targeted checks only when conflicts were resolved, main changed files the branch also changed, or main changed shared infrastructure or test or validation config; otherwise rely on CI. When conflicts in behavioral code were resolved, also review the resolved diff (`/review` or a review subagent). Fix every failure here.'
      - '7. Push the branch to main from the worktree with `git push origin <change-name>:main`; if it is rejected, return to step 6. Then run `machine update` in the live checkout, so it fast-forwards and applies the change like any update. If the update reports a blocker or needs a password, stop and report it.'
      - '8. Ask before removing the worktree and the branch.'
