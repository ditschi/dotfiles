---
services:
  shell:
    build:
      context: docker
    image: dotfiles-preset-test:local
    working_dir: /dotfiles
    volumes:
      - ..:/dotfiles:rw
    environment:
      DOTFILES_REPO: /dotfiles
      DEBIAN_FRONTEND: noninteractive
      HOME: /home/tester
    user: tester
    stdin_open: true
    tty: true
    command: ["bash", "-lc", "git config --global --add safe.directory /dotfiles; exec bash"]
