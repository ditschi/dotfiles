---
# CI / integration: docker --hostname ci-home-laptop
# Mirrors the L13 Yoga (private desktop); the test sets the context and device by
# override inside its container. Stylus/sshd services are skipped or soft there.
context: private
device: desktop
features:
  - zsh-full
  - fonts
  - desktop
  - gnome
  - monitoring
  - ssh-host-key
  - stylus-touch-guard
  - touch-device
  - sshd-home
  - etckeeper
  - lid-switch
  - power-profile-switch
  - battery-charge-limit
  - zram-swap
ssh_allow_from: []
